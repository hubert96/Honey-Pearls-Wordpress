stages:
  - deploy

deploy_production:
  stage: deploy
  only:
    - main
  tags:
    - local
  before_script:
    # Tworzenie pliku .env z wartościami z GitLaba
    - apk add --no-cache rsync git unzip curl bash

  script:
    - cp "$ENV_FILE" /var/www/honey-pearls-wordpress/.env
    # skopiuj repo do katalogu docelowego
    - rsync -av --exclude='.git' ./ /var/www/honey-pearls-wordpress/
    # wejdź do katalogu głównego Bedrock i zainstaluj zależności
    - cd /var/www/honey-pearls-wordpress && composer install --no-dev --optimize-autoloader


    # Opcjonalnie ustaw właściwe uprawnienia
    - mkdir /var/www/honey-pearls-wordpress/web/wp-content
    - chown -R www-data:www-data /var/www/honey-pearls-wordpress

    - find /var/www/honey-pearls-wordpress/web/wp-content -type d -exec chmod 755 {} \;
    - find /var/www/honey-pearls-wordpress/web/wp-content -type f -exec chmod 644 {} \;

  after_script:
    - echo "Deploy zakończony"